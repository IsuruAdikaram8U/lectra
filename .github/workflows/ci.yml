name: Lectra Backend CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lectra_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # Caches pip downloads between runs, keyed off requirements.txt —
          # cache is invalidated automatically whenever that file changes.
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Missing Migrations
        env:
          DB_NAME: lectra_test_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python backend/manage.py makemigrations --check --dry-run

      - name: Run Migrations on PostgreSQL
        env:
          DB_NAME: lectra_test_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python backend/manage.py migrate

      - name: Run Tests
        env:
          DB_NAME: lectra_test_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python backend/manage.py test